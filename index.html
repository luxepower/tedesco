<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0067C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ripasso">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Deutsch Lernen – Ripasso</title>
<style>
:root{--bg:#F3F3F3;--card:#fff;--bd:#E0E0E0;--tx:#1B1B1B;--sub:#6B6B6B;--ac:#0067C0;--act:#fff;--ok:#0F7B0F;--bad:#C42B1C;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#202020;--card:#2B2B2B;--bd:#3D3D3D;--tx:#fff;--sub:#A8A8A8;--ac:#4CC2FF;--act:#00243A;--ok:#6CCB5F;--bad:#FF99A4;--chip:#2B2B2B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
[hidden]{display:none!important}
h1{font-size:22px;margin:4px 0}
header{display:flex;align-items:center;gap:8px}
header h1{flex:1}
#status{font-size:13px;color:var(--sub)}
#status.ok{color:var(--ok)}#status.off{color:var(--bad)}
button{font:inherit;color:var(--tx);background:var(--chip);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
button.primary{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
button.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.row{display:flex;gap:6px}.row button{flex:1;padding:8px 6px;font-size:14px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;font-size:14px;border-radius:999px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
#barfill{height:100%;width:0;background:var(--ac);transition:width .3s}
#counter{margin:0;font-size:13px;color:var(--sub)}
#card{flex:1;min-height:240px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;user-select:none}
#card p{margin:0}
#lang{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ac)}
#word{font-size:32px;font-weight:700;word-break:break-word}
#plural{font-size:18px;color:var(--ac)}
#example{font-size:15px;font-style:italic;color:var(--sub)}
#hint{font-size:13px;color:var(--sub);margin-top:6px!important}
#actions{display:flex;gap:10px;padding-bottom:8px}
#actions button{flex:1;padding:16px 10px;font-size:18px;border-radius:14px}
form{display:flex;flex-direction:column;gap:10px}
input{font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.msg{color:var(--sub);font-size:14px;min-height:1.2em;margin:0}
.sub{color:var(--sub)}
</style>
</head>
<body>
<main id="setup" hidden>
  <h1>Deutsch Lernen</h1>
  <p>Manca la configurazione. Apri il file <b>config.js</b> e incolla i dati del tuo progetto Firebase, come spiegato in <b>ISTRUZIONI_TELEFONO.txt</b>.</p>
</main>
<main id="login" hidden>
  <h1>Deutsch Lernen</h1>
  <p class="sub">Accedi con lo stesso account che hai usato sul PC.</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Accedi</button>
    <p class="msg" id="loginMsg"></p>
  </form>
</main>
<main id="app" hidden>
  <header><h1>Ripasso</h1><span id="status"></span><button class="ghost" id="logout">Esci</button></header>
  <div class="row" id="dir">
    <button data-dir="de2it">Tedesco → Italiano</button>
    <button data-dir="it2de">Italiano → Tedesco</button>
  </div>
  <div id="chips"></div>
  <div class="bar"><div id="barfill"></div></div>
  <p id="counter"></p>
  <section id="card" aria-live="polite">
    <p id="lang"></p><p id="word"></p><p id="plural"></p><p id="example"></p><p id="hint"></p>
  </section>
  <div id="actions"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
